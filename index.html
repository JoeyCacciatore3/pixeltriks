<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="color-scheme" content="dark light">
<title>PixelTriks — Free Browser-Based 3D Game Asset Studio</title>
<meta name="description" content="Create and modify 3D game assets in your browser — no install, no account, no build step. Model shapes, edit meshes, apply textures and materials to specific zones, and export GLB. Free and open source.">
<link rel="canonical" href="https://pixeltriks.com/">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://pixeltriks.com/">
<meta property="og:title" content="PixelTriks — Free Browser-Based 3D Game Asset Studio">
<meta property="og:description" content="Create and modify 3D game assets in your browser — no install, no account, no build step. Model shapes, edit meshes, and apply textures to specific zones. Export GLB.">
<meta property="og:image" content="https://pixeltriks.com/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PixelTriks — Free Browser-Based 3D Game Asset Studio">
<meta name="twitter:description" content="Create and modify 3D game assets in your browser — no install, no account, no build step. Free and open source.">
<meta name="twitter:image" content="https://pixeltriks.com/assets/og-card.png">
<!-- JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "PixelTriks",
  "url": "https://pixeltriks.com",
  "applicationCategory": "DesignApplication",
  "operatingSystem": "Web Browser",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "description": "A free browser-based 3D game-asset studio. Model primitives, edit meshes (vertices, edges, faces), apply textures and materials to specific zones, and export GLB/GLTF. No install, no account required.",
  "featureList": ["3D primitive modeling", "Mesh editing (vertices, edges, faces)", "Per-zone textures and materials", "Procedural texture generation", "GLB/GLTF import and export", "Gamepad-driven manipulation", "One-file interactive web export"]
}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- High-quality UI type (Inter); degrades to the system stack offline / on file:// -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ui/forge.css">
<!-- Three.js (vendored, offline-first) — ui/three-bundle.js statically imports
     it through this map and hands it to core/scene3d.js via window.__THREE_BUNDLE -->
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module" src="ui/three-bundle.js"></script>
</head>
<body data-mode="3d">

<!-- ============================= TOP BAR ============================= -->
<header id="topbar">
  <div class="tb-group tb-left">
    <button class="icon-btn menu-btn" id="btn-menu" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand"><span class="brand-mark">◆</span><span class="brand-name">PixelTriks</span></span>
    <button class="text-btn" id="btn-open">Open</button>
  </div>

  <div class="tb-group tb-center">
    <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg>
    </button>
    <div class="zoom-pill">
      <button class="icon-btn sm" id="btn-zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="zoom-label" id="zoom-label" title="Fit to screen">100%</button>
      <button class="icon-btn sm" id="btn-zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <span id="doc-dims" class="dims" aria-live="polite"></span>
  </div>

  <div class="tb-group tb-right">
    <button class="palette-trigger" id="btn-palette" title="Command palette (Ctrl/⌘K)" aria-label="Command palette">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <span class="kbd">⌘K</span>
    </button>
    <button class="icon-btn" id="btn-history" title="Undo history" aria-label="Undo history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>
    <button class="icon-btn" id="btn-shortcuts" title="Keyboard shortcuts (? or K)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M8 14h8"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Toggle light / dark" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
    <button class="text-btn primary topbar-action" id="btn-export">Export</button>
  </div>
</header>

<!-- ============================= STAGE ============================= -->
<main id="stage">

  <!-- VIEWPORT -->
  <section id="viewport" aria-label="Canvas">
    <!-- 3D workspace host — the renderer canvas mounts here -->
    <div id="scene3d-host"></div>

    <!-- floating single-touch companion (mobile; CSS shows it only ≤880px) -->
    <div id="touch-companion">
      <button class="icon-btn" id="tc-undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
      <button class="icon-btn" id="tc-fit" aria-label="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="tc-redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
    </div>
  </section>

  <!-- RIGHT PANEL (desktop) / BOTTOM SHEET (mobile) -->
  <aside id="panel" data-tab="scene">
    <div class="panel-grip"></div>
    <div class="panel-tabs" role="tablist">
      <button class="ptab" data-tab="scene" role="tab">Props</button>
      <button class="ptab" data-tab="assets" role="tab">Assets</button>
    </div>

    <div class="panel-body">
      <!-- PROPERTIES TAB (3D scene — content built by ui/scene3d-ui.js) -->
      <div class="ptab-pane" data-pane="scene"></div>

      <!-- ASSETS TAB (imported models / textures / materials — built by ui/assets-ui.js) -->
      <div class="ptab-pane" data-pane="assets" hidden>
        <div id="asset-section"></div>
      </div>
    </div>
  </aside>

  <!-- BOTTOM ACTION BAR — populated dynamically by hotbar.js based on context -->
  <div id="actionbar"></div>

  <!-- SYSTEM STATUS BAR — thin HUD footer with live stats -->
  <div id="statusbar">
    <span class="sb-item" id="sb-gpu" title="GPU status">⬡ WebGL2</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-objects" title="Objects">◧ 0 objects</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-mode" title="Mode">● 3D</span>
    <span class="sb-sep"></span>
    <span class="sb-item sb-right" id="sb-mem" title="Memory estimate">—</span>
  </div>

</main>

<!-- mobile panel toggle -->
<button id="panel-toggle" aria-label="Panels">
  <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Props</span>
</button>

<!-- hidden file input -->
<input type="file" id="file-input" accept="image/*,.json,.forge.json,.glb,.gltf,.hdr,.svg,.bin" multiple hidden>

<!-- toast (engine's GF.util.toast targets #toast) -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- ============================= ENGINE ============================= -->
<script src="core/util.js"></script>
<script src="core/api.js"></script>
<script src="core/context.js"></script>
<script src="core/commands.js"></script>
<script src="core/plugins.js"></script>
<!-- BUG-024: transform-manager.js removed — was orphaned dead code -->
<!-- ===================== texture helpers (normal map / seamless / palette) ===================== -->
<script src="core/texgen.js"></script>
<!-- ===================== 3D workspace + asset library ===================== -->
<script src="core/library.js"></script>
<script src="core/scene3d.js"></script>
<!-- animation engine -->
<script src="core/animation.js"></script>
<!-- one-file interactive web-page export -->
<script src="core/publish.js"></script>
<!-- 3D texture painting -->
<script src="core/paint3d.js"></script>
<!-- mesh edit mode (verts / edges / faces + operators) -->
<script src="core/editmesh.js"></script>
<!-- ===================== asset library ===================== -->
<script src="core/assets.js"></script>
<!-- ============================= UI (modular) ============================= -->
<script src="ui/transform-pad.js"></script>
<script src="ui/gamepad.js"></script>
<script src="ui/remap.js"></script>
<script src="ui/hotbar.js"></script>
<script src="ui/forge-ui.js"></script>
<script src="ui/scene3d-ui.js"></script>
<script src="ui/editmesh-ui.js"></script>
<script src="ui/assets-ui.js"></script>
<script src="ui/timeline-ui.js"></script>
<script src="ui/polish.js"></script>
</body>
</html>
